name: hunt
on:
  schedule:
    - cron: "*/5 * * * *"   # fastest GitHub allows; runs can lag a few min
  workflow_dispatch:
permissions:
  contents: write
concurrency: hunt
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python hunt.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      - name: Save seen ads
        run: |
          git config user.name "deal-hunter"
          git config user.email "actions@github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen" && git push)
